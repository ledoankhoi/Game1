<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Memory Card | MathQuest</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/memory.css">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3b82f6",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0a0f1a",
                    },
                    fontFamily: {
                        display: ["Space Grotesk", "sans-serif"],
                    },
                },
            },
        }
    </script>
    <style>
        body { overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-background-dark text-slate-100 font-display min-h-screen flex flex-col">

<div class="flex flex-1 w-full max-w-[1200px] mx-auto p-6 gap-6 flex-col lg:flex-row mt-4">

    <aside class="w-full lg:w-72 flex flex-col gap-6 shrink-0">

        <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-sm">
            <h3 class="font-bold text-sm uppercase tracking-wider text-slate-500 mb-4">Thông Số</h3>
            <div class="stats-grid">
                <div class="stat-card highlight">
                    <div class="stat-label">Điểm</div>
                    <div class="stat-value text-primary" id="current-score">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Cặp</div>
                    <div class="stat-value text-emerald-400" id="pairs-matched">0/8</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Lượt</div>
                    <div class="stat-value text-yellow-400" id="move-count">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Thời Gian</div>
                    <div class="stat-value text-slate-300" id="game-timer">00:00</div>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-sm flex-1 flex flex-col min-h-[200px] overflow-hidden">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                <h3 class="font-bold text-sm uppercase tracking-wider text-slate-500">Nhật Ký</h3>
                <span class="material-symbols-outlined text-slate-400 text-sm">history</span>
            </div>
            <div id="move-log" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-2">
                <div class="text-center text-sm text-slate-500 italic mt-4">Hãy lật thẻ để bắt đầu...</div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-slate-900 rounded-2xl border border-slate-800 shadow-sm p-8 relative">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div>
                <h2 class="text-3xl font-bold tracking-tight">Memory Card</h2>
                <p class="text-slate-500 text-sm mt-1 uppercase tracking-widest font-bold">Classic Mode</p>
            </div>
            <button id="reset-btn" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold transition-all border border-slate-700 active:scale-95 uppercase tracking-widest text-sm">
                <span class="material-symbols-outlined text-sm">refresh</span> Chơi lại
            </button>
        </div>

        <div class="flex-1 flex items-center justify-center py-4">
            <div id="memory-grid" class="memory-grid"></div>
        </div>

        <div class="border-t border-slate-800 pt-5 mt-5 flex justify-between items-center">
            <div class="text-slate-500 text-sm bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                Click vào thẻ để lật • Ghép đôi tất cả thẻ để chiến thắng
            </div>
        </div>
    </main>
</div>

<div id="memory-gameover-overlay" class="fixed inset-0 z-[99999] hidden items-center justify-center bg-[#0a0f1a]/95 opacity-0 transition-opacity duration-500 overflow-hidden backdrop-blur-sm">

    <div class="absolute inset-0 pointer-events-none opacity-20 z-0">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-500/30 to-transparent blur-2xl"></div>
    </div>

    <div class="overlay-content z-10 bg-slate-900 border border-slate-800 rounded-3xl p-10 shadow-2xl flex flex-col items-center max-w-md w-full text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>

        <div class="size-20 bg-emerald-500/10 border border-emerald-500/30 rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(16,185,129,0.2)]">
            <span class="material-symbols-outlined text-5xl text-emerald-400" style="font-variation-settings: 'FILL' 1;">psychology</span>
        </div>

        <h1 class="text-4xl font-black tracking-tight text-white mb-2 uppercase">HOÀN THÀNH!</h1>
        <p class="text-slate-400 mb-8 font-medium">Bạn đã ghép đôi tất cả các thẻ!</p>

        <div class="w-full grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-col items-center">
                <span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Final Score</span>
                <span id="go-final-score" class="text-3xl font-black text-white">0</span>
            </div>
            <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-col items-center">
                <span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Thời Gian</span>
                <span id="go-time-display" class="text-3xl font-black text-slate-300">00:00</span>
            </div>
        </div>

        <div id="go-reward-container" class="w-full grid grid-cols-2 gap-4 mb-8 hidden">
            <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-lg p-3 flex justify-center items-center gap-2">
                <span class="material-symbols-outlined text-yellow-400 text-xl" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
                <span id="go-earned-coins" class="font-black text-yellow-400 text-xl">+0</span>
            </div>
            <div class="bg-green-500/10 border border-green-500/30 rounded-lg p-3 flex justify-center items-center gap-2">
                <span class="material-symbols-outlined text-green-400 text-xl" style="font-variation-settings: 'FILL' 1;">star</span>
                <span id="go-earned-exp" class="font-black text-green-400 text-xl">+0</span>
            </div>
        </div>

        <div class="flex flex-col gap-3 w-full">
            <button onclick="location.reload()" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all transform active:scale-95 uppercase tracking-widest">
                CHƠI LẠI
            </button>
            <button onclick="window.location.href='/'" class="w-full bg-transparent hover:bg-slate-800 border border-slate-700 text-slate-400 hover:text-white font-bold py-3 rounded-xl transition-colors uppercase tracking-widest text-sm">
                VỀ LOBBY
            </button>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/game-header.js"></script>
<script src="js/rewardManager.js"></script>
<script src="./js/games/memory.js"></script>

</body>
</html>
