<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chess Multiplayer | MathQuest</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="css/chess-multi.css">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3b82f6",
                        "background-dark": "#0a0f1a",
                    },
                    fontFamily: {
                        display: ["Space Grotesk", "sans-serif"],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-dark text-slate-100 font-display min-h-screen flex flex-col">

<div id="header-placeholder"></div>

<main class="flex-1 flex flex-col lg:flex-row w-full max-w-[1400px] mx-auto p-4 lg:p-6 gap-6">

    <!-- LOBBY PANEL -->
    <aside id="lobby-panel" class="w-full lg:w-80 flex flex-col gap-4 shrink-0">
        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-sm">
            <h2 class="font-bold text-sm uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">sports_esports</span> Đấu Trường
            </h2>

            <div class="flex gap-2 mb-4">
                <input id="username-input" type="text" placeholder="Tên của bạn..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-primary transition-colors" />
            </div>

            <button id="create-room-btn" class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all active:scale-95 shadow-lg shadow-primary/20 mb-3">
                <span class="material-symbols-outlined text-sm">add_circle</span> Tạo Phòng
            </button>

            <div class="text-center text-xs text-slate-500 uppercase tracking-widest font-bold mb-3">— hoặc tham gia —</div>

            <div class="flex gap-2">
                <input id="room-code-input" type="text" placeholder="Mã phòng..." maxlength="4" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white text-center uppercase tracking-widest font-bold outline-none focus:border-primary transition-colors" />
                <button id="join-room-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl transition-all active:scale-95">
                    <span class="material-symbols-outlined">login</span>
                </button>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-sm flex-1 flex flex-col min-h-[200px]">
            <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500 mb-3 flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">meeting_room</span> Phòng Chờ
                <span id="room-count" class="ml-auto text-slate-600 font-mono text-xs">0</span>
            </h3>
            <div id="room-list" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1">
                <div class="text-center text-sm text-slate-600 italic mt-6">Chưa có phòng nào</div>
            </div>
        </div>
    </aside>

    <!-- GAME PANEL -->
    <div id="game-panel" class="flex-1 flex flex-col items-center justify-center bg-slate-900 rounded-2xl border border-slate-800 shadow-sm p-4 lg:p-8 relative min-h-[500px]">
        <!-- Waiting overlay -->
        <div id="waiting-overlay" class="absolute inset-0 bg-slate-900/90 rounded-2xl flex flex-col items-center justify-center z-20 hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-primary mb-4"></div>
            <p class="text-slate-400 font-bold text-lg" id="waiting-text">Đang chờ đối thủ...</p>
            <button id="cancel-wait-btn" class="mt-6 text-sm text-slate-500 hover:text-red-400 transition-colors font-bold">Hủy</button>
        </div>

        <!-- Info bar -->
        <div id="game-info" class="w-full hidden mb-4">
            <div class="flex items-center justify-between bg-slate-800 rounded-xl px-5 py-3 border border-slate-700">
                <div class="flex items-center gap-3">
                    <span class="text-xs uppercase tracking-widest text-slate-500 font-bold">Phòng</span>
                    <span id="room-code-display" class="font-mono font-black text-primary text-lg tracking-widest">----</span>
                </div>
                <div id="turn-display" class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-slate-500" id="turn-indicator"></span>
                    <span class="text-sm font-bold text-slate-400" id="turn-text">Đang chờ...</span>
                </div>
                <button id="leave-game-btn" class="text-slate-500 hover:text-red-400 transition-colors">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </div>

        <!-- Player info -->
        <div id="players-bar" class="w-full hidden mb-3">
            <div class="flex justify-between items-center">
                <div id="player-white" class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-xl border border-slate-700">
                    <span class="text-lg">♔</span>
                    <span class="text-sm font-bold text-slate-300">---</span>
                </div>
                <div class="text-xs text-slate-600 font-bold uppercase tracking-widest">VS</div>
                <div id="player-black" class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-xl border border-slate-700">
                    <span class="text-lg">♚</span>
                    <span class="text-sm font-bold text-slate-300">---</span>
                </div>
            </div>
        </div>

        <!-- Chess Board -->
        <div id="board-wrapper" class="relative hidden">
            <div id="chess-board" class="chess-board"></div>
            <div id="move-history" class="mt-4 bg-slate-800 rounded-xl p-3 border border-slate-700 max-h-24 overflow-y-auto custom-scrollbar">
                <h4 class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-2">Lịch sử nước đi</h4>
                <div id="moves-list" class="flex flex-wrap gap-1.5 text-xs font-mono text-slate-300"></div>
            </div>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="flex flex-col items-center justify-center text-center">
            <span class="material-symbols-outlined text-7xl text-slate-800 mb-4" style="font-variation-settings: 'FILL' 1;">chess</span>
            <h3 class="text-xl font-bold text-slate-500 mb-2">Cờ Vua Multiplayer</h3>
            <p class="text-sm text-slate-600 max-w-md">Tạo phòng hoặc tham gia phòng để bắt đầu trận đấu</p>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameover-overlay" class="absolute inset-0 bg-slate-900/95 rounded-2xl flex flex-col items-center justify-center z-20 hidden backdrop-blur-sm">
            <div class="text-center">
                <span class="material-symbols-outlined text-6xl text-yellow-400 mb-4" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                <h2 class="text-3xl font-black text-white mb-2" id="go-title">KẾT THÚC</h2>
                <p class="text-slate-400 text-lg mb-6" id="go-result">---</p>
                <div class="flex gap-3">
                    <button id="rematch-btn" class="bg-primary hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl transition-all active:scale-95 shadow-lg">
                        Đấu Lại
                    </button>
                    <button id="go-lobby-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold py-3 px-6 rounded-xl transition-all">
                        Về Sảnh
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js';
window.Chess = Chess;
</script>
<script type="module" src="/src/game-entries/chess-multi.js"></script>

</body>
</html>
